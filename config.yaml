# YAML Configuration File for FlappyBird Evolution
# All parameters for the LGP evolution system

# Global Settings
random_seed: 42  # Random seed for reproducibility

# Memory Configuration
# Defines the memory structure for LGP programs
memory:
  n_scalar: 8          # Number of working scalar registers
  n_vector: 8          # Number of working vector registers
  n_matrix: 8          # Number of working matrix registers
  n_obs_scalar: 0      # Number of scalar observation registers
  n_obs_vector: 0      # Number of vector observation registers
  n_obs_matrix: 1      # Number of matrix observation registers
  vector_size: 22      # Size of vector registers
  matrix_shape: [22, 22]  # Shape of matrix registers [height, width]
                         # Note: patch_size = 37 is calculated from quantization_factor=0.05
                         # (int(750 * 0.05) = 37)

# Evaluator Configuration
# Settings for the FlappyBird environment evaluator
evaluator:
  env_id: "FlappyBird-v0"  # Gymnasium environment ID
  episodes: 5             # Number of episodes per evaluation
  max_steps: 500           # Maximum steps per episode
  output_register: 0      # Scalar register to read action from
  headless: true            # Use headless mode (faster, no windows). If false, uses "human" rendering
  render_mode: null        # Rendering mode: "human", "rgb_array", or null (auto-set by headless if null)
  rng_seed: 42             # Random seed for evaluator (uses random_seed if not specified)
  
  # Image Processing Parameters
  patch_strategy: "quantized"  # Strategy: "full_image", "quantized", or "feature_vector"
  color_channel: 2           # Color channel: 0=R, 1=G, 2=B, -1=grayscale
  normalize: true             # Normalize pixel values to [0, 1]
  quantization_factor: 0.03   # Downsampling factor for quantized strategy
  feature_vector_size: 256    # Feature vector dimension for feature_vector strategy
  
  # Parallelization
  n_jobs: null  # Number of parallel workers: null=auto-detect, 1=sequential, >1=number of workers

# Population Configuration
# Settings for the evolutionary population
population:
  size: 1000                   # Population size
  program_length: [1, 10]     # Program length range [min, max]
  elitism: 500                 # Number of elite individuals to preserve
  max_program_length: null     # Maximum program length (null for no limit)

# Evolution Configuration
# Settings for the evolutionary algorithm
evolution:
  max_generations: 500         # Maximum number of generations
  mutation_threshold: 0.9     # Probability threshold for mutation (0.0-1.0)
  constant_mutation_rate: 0.1 # Probability of mutating constants (0.0-1.0)
  crossover_threshold: 0.9     # Probability threshold for crossover (0.0-1.0)
  verbose: true               # Print detailed progress information
  checkpoint_path: "checkpoints/best_population.pkl"  # Path to save checkpoints (null to disable)
  stats_log_dir: "stats_log"   # Directory to save CSV statistics (null to disable)

# Operations Configuration
# Which operation sets to include
operations:
  use_automl: true  # Include AutoML operations
  use_cv: true      # Include Computer Vision operations

# Output Configuration
# Settings for saving results
output:
  save_best_agent: true              # Whether to save best agent to file
  best_agent_dir: "best_agents"      # Directory to save best agent files
  fitness_chart_path: "fitness_chart.png"  # Path to save fitness chart

