# YAML Configuration File for FlappyBird Evolution
# All parameters for the LGP evolution system

# Global Settings
random_seed: 0  # Random seed for reproducibility

# Memory Configuration
# Defines the memory structure for LGP programs
memory:
  n_scalar: 8          # Number of working scalar registers
  n_vector: 8          # Number of working vector registers
  n_matrix: 8          # Number of working matrix registers
  n_obs_scalar: 0      # Number of scalar observation registers
  n_obs_vector: 1      # Stores the 1D feature vector (64 elements)
  n_obs_matrix: 1      # Stores the tiled feature matrix (64×64)
  vector_size: 64      # MUST match feature_vector_size!
  matrix_shape: [64, 64]  # MUST match [feature_vector_size, feature_vector_size]!

# Evaluator Configuration
# Settings for the FlappyBird environment evaluator
evaluator:
  env_id: "FlappyBird-v0"  # Gymnasium environment ID
  episodes: 5             # Number of episodes per evaluation
  max_steps: 500           # Maximum steps per episode
  output_register: 0      # Scalar register to read action from
  headless: true            # Use headless mode (faster, no windows). If false, uses "human" rendering
  render_mode: "rgb_array"        # Rendering mode: "human", "rgb_array", or null (auto-set by headless if null)
  rng_seed: 0             # Random seed for evaluator (uses random_seed if not specified)
  
  # Image Processing Parameters
  patch_strategy: "feature_vector"  # Strategy: "full_image", "quantized", or "feature_vector"
  color_channel: 2           # Color channel: 0=R, 1=G, 2=B, -1=grayscale
  normalize: false             # Normalize pixel values to [0, 1]
  quantization_factor: 0.03   # Downsampling factor for quantized strategy
  feature_vector_size: 64    # Feature vector dimension for feature_vector strategy
  
  # Parallelization
  n_jobs: 64  # Number of parallel workers (match SLURM --cpus-per-task)

# Population Configuration
# Settings for the evolutionary population
population:
  size: 500                 # Population size
  program_length: [10, 100]     # Program length range [min, max]
  elitism: 200               # Number of elite individuals to preserve
  max_program_length: null     # Maximum program length (null for no limit)

# Evolution Configuration
# Settings for the evolutionary algorithm
evolution:
  max_generations: 500        # Maximum number of generations
  mutation_threshold: 0.9     # Probability threshold for mutation (0.0-1.0)
  constant_mutation_rate: 0.1 # Probability of mutating constants (0.0-1.0)
  crossover_threshold: 0.9     # Probability threshold for crossover (0.0-1.0)
  verbose: true               # Print detailed progress information

# Operations Configuration
# Which operation sets to include (checked in order, first true wins)
operations:
  use_feature_vector_ops: True  # 12 ops: 8 scalar + 4 vector (dot_product, mean, sum, norm)
                                # Best for feature_vector strategy!
  use_minimal_scalar: false     # 8 scalar-only ops (simpler baseline)
  use_minimal: false            # 28-op set (for quantized/full_image strategies)
  use_automl_no_random: false  # AutoML operations without constant/random/gaussian ops
                                # (only if above are false, checked before use_automl)
  use_automl: true              # Include AutoML operations (only if above are false)
  use_cv: false                  # Include CV operations (only if above are false)

# Experiment Configuration
# Unified output management - all outputs go under experiments/<run_id>/
experiment:
  name: "feature_vector_ops"                    # Custom name suffix for run ID (null = timestamp only)
  base_dir: "experiments"       # Base directory for all experiment runs
  checkpoint_every: null          # Save checkpoint every N generations (null = only on improvement)
  keep_n_checkpoints: null      # Keep last N checkpoints (null = keep all)
